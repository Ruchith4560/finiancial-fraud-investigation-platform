# ==============================================================================
# FraudLens AI - Render Cloud Deployment Blueprint (Spec-Compliant)
# Infrastructure-as-Code for Python FastAPI, Node.js Express, and React 19 SPA
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Intelligence Analytics Service (Python 3.11 FastAPI + NetworkX + ML)
  # ----------------------------------------------------------------------------
  - type: web
    name: fraudlens-intelligence
    runtime: python
    rootDir: intelligence-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
    healthCheckPath: /api/v1/health

  # ----------------------------------------------------------------------------
  # 2. Application Backend API (Node.js 20 Express + Mongoose + Zod)
  # ----------------------------------------------------------------------------
  - type: web
    name: fraudlens-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: memory
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: INTELLIGENCE_SERVICE_URL
        value: http://fraudlens-intelligence:10000
      - key: CLIENT_ORIGIN
        value: "*"
    healthCheckPath: /api/v1/health

  # ----------------------------------------------------------------------------
  # 3. Web Presentation Layer (React 19 SPA + Vite + Tailwind CSS v4)
  # ----------------------------------------------------------------------------
  - type: web
    name: fraudlens-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
